name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, mbstring, fileinfo, zip, curl
          coverage: none

      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Test scripts
        run: |
          status=0
          for t in tests/*_checks.php; do
            echo "::group::$t"
            php "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan:2
          coverage: none

      - run: phpstan analyse --no-progress --error-format=github --memory-limit=1G

  schema:
    name: schema.sql (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.6', 'mysql:8.0']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: bvlog
          MARIADB_DATABASE: bvlog
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Import schema twice (must be idempotent)
        run: |
          mysql -h 127.0.0.1 -uroot -proot bvlog < schema.sql
          mysql -h 127.0.0.1 -uroot -proot bvlog < schema.sql
          mysql -h 127.0.0.1 -uroot -proot bvlog -e 'SHOW TABLES'

  assets:
    name: Asset build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Report differences from committed assets
        run: |
          if ! git diff --quiet -- assets; then
            echo "::notice::Built assets differ from the committed assets/ directory. Run npm run build and commit assets/ if resources/ changed."
            git diff --stat -- assets
          fi
